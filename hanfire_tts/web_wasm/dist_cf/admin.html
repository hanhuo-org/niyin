<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汉火古音 · 站长私密听审管理后台</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    :root {
      --bg: #121110;
      --panel: #1c1a17;
      --panel-alt: #25221d;
      --border: #3a342b;
      --gold: #d6a85a;
      --jade: #4ea885;
      --crimson: #d95b49;
      --text: #f0eadc;
      --muted: #a69d8d;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --serif: "Noto Serif CJK SC", "Songti SC", serif;
      --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1f1b16 0%, var(--bg) 70%);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 26px 20px 60px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    h1 { margin: 0; font-family: var(--serif); color: var(--gold); font-size: 1.5rem; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    .login-box { max-width: 440px; margin: 72px auto; }
    input, select, textarea {
      padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #141210; color: var(--text); font-family: inherit; font-size: 0.88rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--gold); }
    .btn {
      padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel-alt); color: var(--text); font-size: 0.82rem;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold); }
    .btn-primary {
      background: linear-gradient(135deg, #e2b86e, #c18b37); color: #161310;
      border: none; font-weight: 700;
    }
    .btn-jade { border-color: rgba(78, 168, 133, 0.6); background: rgba(78, 168, 133, 0.16); color: #84e6bf; }
    .btn-danger { border-color: rgba(217, 91, 73, 0.55); color: #f08a7c; }
    .btn-sm { padding: 4px 9px; font-size: 0.76rem; }

    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px; margin-bottom: 16px;
    }
    .kpi {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; text-align: center;
    }
    .kpi .k { font-size: 0.75rem; color: var(--muted); }
    .kpi .v { font-size: 1.4rem; font-family: var(--mono); color: var(--gold); margin-top: 3px; }

    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .fb-item {
      background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .fb-item.public-on { border-left: 4px solid var(--jade); }
    .fb-top {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 8px;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem;
      border: 1px solid var(--border); background: var(--panel-alt); color: var(--muted);
      font-family: var(--mono);
    }
    .badge.pub { border-color: rgba(78, 168, 133, 0.6); color: #84e6bf; background: rgba(78, 168, 133, 0.14); }
    .badge.adopted { border-color: rgba(214, 168, 90, 0.6); color: #f0ca86; background: rgba(214, 168, 90, 0.14); }
    .badge.adj { border-color: rgba(114, 169, 240, 0.55); color: #9fc6f7; background: rgba(114, 169, 240, 0.14); }
    .text-quote {
      font-family: var(--serif); font-size: 1.05rem; color: var(--gold); margin: 6px 0;
    }
    .box-mono {
      font-family: var(--mono); font-size: 0.78rem; padding: 8px 10px; border-radius: 8px;
      background: #141210; border: 1px solid var(--border); margin: 6px 0; word-break: break-all;
    }
    .adj-list {
      margin: 6px 0; padding: 8px 10px; border-radius: 8px;
      background: rgba(114, 169, 240, 0.08); border: 1px solid rgba(114, 169, 240, 0.28);
      font-family: var(--mono); font-size: 0.78rem; color: #c4ddfc;
    }
    .fb-actions {
      display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
      margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 9px;
      background: #23201b; border: 1px solid var(--gold); color: var(--gold);
      font-size: 0.85rem; display: none; z-index: 99;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🔐 汉火古音 · 站长私密听审管理后台</h1>
        <div style="font-size:0.8rem;color:var(--muted);margin-top:3px;">
          查看全部打分、邮箱、IPA 纠正与用户前端调音记录 · 审核点击「公开」即可上墙
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <a href="./" class="btn">← 返回工作台</a>
        <button type="button" id="logoutBtn" class="btn btn-danger" style="display:none;">退出登录</button>
      </div>
    </header>

    <!-- 登录卡片 -->
    <section id="loginView" class="card login-box">
      <h2 style="margin:0 0 12px;color:var(--gold);font-size:1.05rem;">输入管理员口令 (ADMIN_TOKEN)</h2>
      <p style="font-size:0.82rem;color:var(--muted);margin:0 0 12px;">
        线上口令存放在 Cloudflare Workers Secret；本地预览口令见启动日志或 <code>web_wasm/.local_admin_token</code>。
      </p>
      <form id="loginForm" style="display:flex;flex-direction:column;gap:10px;">
        <input type="password" id="tokenInput" placeholder="输入 ADMIN_TOKEN..." required autocomplete="current-password" />
        <button type="submit" class="btn btn-primary" style="justify-content:center;padding:10px;">登录后台</button>
        <div id="loginErr" style="color:#f28476;font-size:0.82rem;"></div>
      </form>
    </section>

    <!-- 后台主视图 -->
    <div id="adminView" style="display:none;">
      <div class="kpi-grid">
        <div class="kpi"><div class="k">总反馈数</div><div class="v" id="kTotal">0</div></div>
        <div class="kpi"><div class="k">平均星级</div><div class="v" id="kAvg">—</div></div>
        <div class="kpi"><div class="k">待处理</div><div class="v" id="kPending">0</div></div>
        <div class="kpi"><div class="k">已公开上墙</div><div class="v" id="kPublic" style="color:#84e6bf;">0</div></div>
        <div class="kpi"><div class="k">含调音/IPA纠错</div><div class="v" id="kFix" style="color:#9fc6f7;">0</div></div>
        <div class="kpi"><div class="k">已采纳</div><div class="v" id="kAdopted">0</div></div>
      </div>

      <section class="card">
        <div class="filters">
          <select id="fEra">
            <option value="">全部时代</option>
            <option value="mc">中古音 (mc)</option>
            <option value="oc">上古音 (oc)</option>
            <option value="em">近古明清 (em)</option>
            <option value="em_zyyy">中原音韵 (em_zyyy)</option>
          </select>
          <select id="fRating">
            <option value="">全部星级</option>
            <option value="low">≤ 3 星（问题优先）</option>
            <option value="5">5 ★</option>
            <option value="4">4 ★</option>
            <option value="3">3 ★</option>
            <option value="2">2 ★</option>
            <option value="1">1 ★</option>
          </select>
          <select id="fStatus">
            <option value="">全部状态</option>
            <option value="pending">待处理</option>
            <option value="adopted">已采纳</option>
            <option value="ignored">已忽略</option>
          </select>
          <select id="fPublic">
            <option value="">公开/私密全部</option>
            <option value="1">仅已公开</option>
            <option value="0">仅未公开</option>
          </select>
          <label style="display:inline-flex;align-items:center;gap:4px;font-size:0.82rem;color:var(--gold);cursor:pointer;">
            <input type="checkbox" id="fHasFix" /> 仅看含调音/纠错
          </label>
          <input type="text" id="fQuery" placeholder="搜昵称/邮箱/原文/IPA..." style="min-width:190px;flex:1;" />
          <button type="button" id="refreshBtn" class="btn btn-primary">刷新</button>
          <button type="button" id="exportJsonBtn" class="btn">⬇ 导出 JSON</button>
          <button type="button" id="exportCsvBtn" class="btn">⬇ 导出 CSV</button>
        </div>
      </section>

      <div id="listContainer"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const TOKEN_KEY = "hanfire_admin_session_token";
    const ERA_NAMES = { oc: "上古音", mc: "中古切韻", em: "近古明清", em_zyyy: "中原音韻" };
    const STATUS_NAMES = { pending: "待处理", adopted: "已采纳", ignored: "已忽略" };

    const loginView = document.getElementById("loginView");
    const adminView = document.getElementById("adminView");
    const logoutBtn = document.getElementById("logoutBtn");
    const tokenInput = document.getElementById("tokenInput");
    const loginErr = document.getElementById("loginErr");
    const listContainer = document.getElementById("listContainer");
    const toastEl = document.getElementById("toast");

    let adminToken = sessionStorage.getItem(TOKEN_KEY) || "";
    let toastTimer = null;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function apiFetch(url, opts = {}) {
      const headers = { ...(opts.headers || {}), Authorization: `Bearer ${adminToken}` };
      const resp = await fetch(url, { ...opts, headers });
      if (resp.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        adminToken = "";
        loginView.style.display = "";
        adminView.style.display = "none";
        logoutBtn.style.display = "none";
        throw new Error("口令无效或已过期，请重新登录");
      }
      return resp;
    }

    async function loadList() {
      const qs = new URLSearchParams();
      if (document.getElementById("fEra").value) qs.set("era", document.getElementById("fEra").value);
      if (document.getElementById("fRating").value) qs.set("rating", document.getElementById("fRating").value);
      if (document.getElementById("fStatus").value) qs.set("status", document.getElementById("fStatus").value);
      if (document.getElementById("fPublic").value) qs.set("is_public", document.getElementById("fPublic").value);
      if (document.getElementById("fHasFix").checked) qs.set("has_fix", "1");
      if (document.getElementById("fQuery").value.trim()) qs.set("q", document.getElementById("fQuery").value.trim());

      const resp = await apiFetch(`./api/admin/feedback?${qs.toString()}`);
      const data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);

      const s = data.stats;
      document.getElementById("kTotal").textContent = s.total;
      document.getElementById("kAvg").textContent = s.total ? `${s.avg_rating} ★` : "—";
      document.getElementById("kPending").textContent = s.pending;
      document.getElementById("kPublic").textContent = s.public_count;
      document.getElementById("kFix").textContent = s.with_fix;
      document.getElementById("kAdopted").textContent = s.adopted;

      listContainer.innerHTML = "";
      if (!data.items || data.items.length === 0) {
        listContainer.innerHTML = '<div class="card" style="color:var(--muted);text-align:center;">暂无符合条件的反馈记录</div>';
        return;
      }

      for (const it of data.items) {
        const div = document.createElement("div");
        div.className = "fb-item" + (it.is_public ? " public-on" : "");
        const stars = "★".repeat(it.rating) + "☆".repeat(5 - it.rating);
        const adjs = it.user_adjustments || [];
        const adjBlock = adjs.length > 0
          ? `<div class="adj-list">
               <div style="font-weight:700;margin-bottom:4px;">🎛 用户在前台调整了 ${adjs.length} 个字的读音：</div>
               ${adjs.map((a) => `<div>• <strong>${esc(a.char)}</strong>：原 /${esc(a.beforeIpa)}/ (${esc(a.beforeTokens)})  ➜  调为 <code>[${esc(a.char)}=${esc(a.spec)}]</code> (/${esc(a.afterIpa)}/ · ${esc(a.afterTokens)})</div>`).join("")}
             </div>`
          : "";
        const ipaBlock = it.ipa_correction
          ? `<div class="box-mono" style="color:#8ee5c2;">📝 IPA 纠正：${esc(it.ipa_correction)}</div>`
          : "";
        const commentBlock = it.comment
          ? `<div style="margin:6px 0;font-size:0.9rem;white-space:pre-wrap;">💬 ${esc(it.comment)}</div>`
          : "";

        div.innerHTML = `
          <div class="fb-top">
            <div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center;">
              <strong style="font-size:0.95rem;">#${it.id} · ${esc(it.nickname)}</strong>
              ${it.email ? `<span class="badge">${esc(it.email)}</span>` : ""}
              <span style="color:#f2be54;letter-spacing:1px;">${stars}</span>
              <span class="badge">${esc(ERA_NAMES[it.era] || it.era)}</span>
              <span class="badge">${it.source_type === "rhyme" ? "单韵试听 " + esc(it.rhyme_id) : "自由合成"}</span>
              ${it.is_public ? '<span class="badge pub">🌐 已公开上墙</span>' : '<span class="badge">🔒 仅后台可见</span>'}
              <span class="badge ${it.status === "adopted" ? "adopted" : ""}">${esc(STATUS_NAMES[it.status] || it.status)}</span>
              ${adjs.length > 0 ? `<span class="badge adj">🎛 调音 ${adjs.length} 字</span>` : ""}
            </div>
            <span style="font-size:0.74rem;color:var(--muted);font-family:var(--mono);">${esc((it.created_at || "").slice(0, 19).replace("T", " "))} · ${esc(it.voice_key)}</span>
          </div>
          <div class="text-quote">「${esc(it.input_text)}」</div>
          ${adjBlock}
          ${ipaBlock}
          ${commentBlock}
          <div class="fb-actions">
            <button type="button" class="btn btn-sm ${it.is_public ? "btn-jade" : ""} toggle-pub-btn">
              ${it.is_public ? "🔒 取消公开" : "🌐 审核公开到前台"}
            </button>
            <button type="button" class="btn btn-sm status-btn" data-st="adopted">✓ 标为已采纳</button>
            <button type="button" class="btn btn-sm status-btn" data-st="pending">↺ 待处理</button>
            <button type="button" class="btn btn-sm status-btn" data-st="ignored">忽略</button>
            <a class="btn btn-sm" target="_blank" href="./?era=${encodeURIComponent(it.era)}&voice=${encodeURIComponent(it.voice_key)}&text=${encodeURIComponent(it.input_text)}">🔊 工作台复现试听</a>
            ${adjs.length > 0 ? `<button type="button" class="btn btn-sm copy-ov-btn">📋 复制 overrides JSON</button>` : ""}
            <input type="text" class="note-input" value="${esc(it.admin_note)}" placeholder="站长备注..." style="flex:1;min-width:140px;padding:4px 8px;font-size:0.78rem;" />
            <button type="button" class="btn btn-sm save-note-btn">存备注</button>
            <button type="button" class="btn btn-sm btn-danger del-btn">删除</button>
          </div>
        `;

        div.querySelector(".toggle-pub-btn").addEventListener("click", async () => {
          const nextPub = it.is_public ? 0 : 1;
          await apiFetch(`./api/admin/feedback/${it.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ is_public: nextPub }),
          });
          showToast(nextPub ? `已公开 #${it.id} 到前台评论墙` : `已取消公开 #${it.id}`);
          loadList();
        });

        div.querySelectorAll(".status-btn").forEach((b) => {
          b.addEventListener("click", async () => {
            await apiFetch(`./api/admin/feedback/${it.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: b.dataset.st }),
            });
            showToast(`#${it.id} 状态已更新为「${STATUS_NAMES[b.dataset.st]}」`);
            loadList();
          });
        });

        div.querySelector(".save-note-btn").addEventListener("click", async () => {
          const note = div.querySelector(".note-input").value.trim();
          await apiFetch(`./api/admin/feedback/${it.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ admin_note: note }),
          });
          showToast(`已保存 #${it.id} 备注`);
        });

        const copyBtn = div.querySelector(".copy-ov-btn");
        if (copyBtn) {
          copyBtn.addEventListener("click", async () => {
            const ov = {};
            for (const a of adjs) ov[a.char] = a.spec;
            const snip = JSON.stringify(ov, null, 2);
            try {
              await navigator.clipboard.writeText(snip);
              showToast(`已复制 ${it.era} overrides JSON 片段！`);
            } catch (_) {
              prompt("请手动复制以下 overrides JSON：", snip);
            }
          });
        }

        div.querySelector(".del-btn").addEventListener("click", async () => {
          if (!confirm(`确定删除反馈 #${it.id}（${it.nickname}）？`)) return;
          await apiFetch(`./api/admin/feedback/${it.id}`, { method: "DELETE" });
          showToast(`已删除 #${it.id}`);
          loadList();
        });

        listContainer.appendChild(div);
      }
    }

    async function tryEnterAdmin() {
      if (!adminToken) return;
      try {
        await loadList();
        loginView.style.display = "none";
        adminView.style.display = "";
        logoutBtn.style.display = "";
        loginErr.textContent = "";
      } catch (err) {
        loginErr.textContent = err.message || String(err);
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      adminToken = tokenInput.value.trim();
      sessionStorage.setItem(TOKEN_KEY, adminToken);
      await tryEnterAdmin();
    });

    logoutBtn.addEventListener("click", () => {
      sessionStorage.removeItem(TOKEN_KEY);
      adminToken = "";
      loginView.style.display = "";
      adminView.style.display = "none";
      logoutBtn.style.display = "none";
      tokenInput.value = "";
    });

    ["fEra", "fRating", "fStatus", "fPublic", "fHasFix"].forEach((id) => {
      document.getElementById(id).addEventListener("change", () => loadList().catch(() => {}));
    });
    document.getElementById("refreshBtn").addEventListener("click", () => loadList().catch(() => {}));
    document.getElementById("fQuery").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") loadList().catch(() => {});
    });

    async function downloadExport(fmt) {
      const resp = await apiFetch(`./api/admin/export?format=${fmt}`);
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `hanfire_feedback.${fmt}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    document.getElementById("exportJsonBtn").addEventListener("click", () => downloadExport("json"));
    document.getElementById("exportCsvBtn").addEventListener("click", () => downloadExport("csv"));

    tryEnterAdmin();
  </script>
</body>
</html>
